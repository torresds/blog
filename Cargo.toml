[workspace]
members = ["crates/bard"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
ammonia = "4.1.2"
comrak = { version = "0.56.0", default-features = false, features = ["syntect"] }
hex = "0.4.3"
hayagriva = { version = "0.10.1", default-features = false, features = ["archive", "csl-json"] }
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
pulldown-latex = "0.8.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
syntect = { version = "5.3.0", default-features = false, features = ["regex-fancy"] }
thiserror = "2.0.18"

